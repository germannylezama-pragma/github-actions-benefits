name: "Infra · Análisis y deploy por rama"
run-name: "Infra · ${{ github.base_ref || github.ref_name }} (${{ github.event_name }})"

# Tres fases, y la RAMA decide el ambiente:
#   Fase 1 · Análisis   Checkov ∥ Trivy ∥ Infracost
#   Fase 2 · Revisión   Job Summary + gate
#   Fase 3 · Deploy     solo en ramas deploy/<ambiente>, si el costo cabe en el
#                       presupuesto del environment (vars.MONTHLY_BUDGET_USD)
#
#   dev → dev · staging → staging · main → prod · deploy/<amb> → <amb> + deploy

on:
  pull_request:
    branches: [dev, staging, main, "deploy/**"]
    paths: ["infra/**", ".github/**"]
  push:
    branches: [dev, staging, main, "deploy/**"]
  workflow_dispatch: # Run workflow: el ambiente sale de la rama que elijas
  repository_dispatch: # desde otro sistema: client_payload = {"environment": "...", "deploy": true}
    types: [deploy-infra]

permissions:
  contents: read
  security-events: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contexto:
    uses: ./.github/workflows/reusable-contexto.yml

  analizar:
    name: "Análisis · ${{ needs.contexto.outputs.environment }}"
    needs: contexto
    permissions: # la versión con comentario de costo necesita escribir en el PR
      contents: read
      security-events: write
      pull-requests: write
    uses: ./.github/workflows/reusable-infra-scan.yml
    with:
      environment: ${{ needs.contexto.outputs.environment }}
    secrets: inherit

  deploy:
    name: "Deploy · ${{ needs.contexto.outputs.environment }}"
    needs: [contexto, analizar]
    if: needs.contexto.outputs.deploy == 'true'
    permissions: # el reutilizable no puede pedir más de lo que concede quien lo llama
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: ${{ needs.contexto.outputs.environment }}
    secrets: inherit
