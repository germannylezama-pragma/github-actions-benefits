name: "PR · Analizar solo lo que cambia"
run-name: "PR #${{ github.event.pull_request.number }} · ${{ github.head_ref }} → ${{ github.base_ref }}"

# En un PR revisa solo los archivos de infra que el PR crea o modifica y comenta
# el resultado. La lógica vive en reusable-pr-cambios.yml: infra-equipo usa el mismo.

on:
  pull_request:
    branches: [dev, staging, main, "deploy/**"]
    paths: ["**.tf", "cloudformation/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-cambios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: ./.github/workflows/reusable-pr-cambios.yml
