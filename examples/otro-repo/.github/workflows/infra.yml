# EJEMPLO: copia este archivo en OTRO repositorio para reutilizar el análisis
# sin copiar ni una línea del pipeline. (Aquí no se ejecuta: está fuera de .github/ raíz.)

name: Infra

on:
  pull_request:
    paths: ["terraform/**"]

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    # @main = la versión estable.
    # @feature/nuevo-gate = probar una versión nueva del pipeline desde OTRA RAMA antes de fusionarla.
    # @v1 o @<sha> = fijar una versión exacta.
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-infra-scan.yml@main
    with:
      environment: dev
      tf_dir: terraform
      budget: 200
    secrets: inherit
